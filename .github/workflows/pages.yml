name: pages
on:
  push:
    branches: [main]
    paths: [map/**]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Publish map/ only: index.html, map.js, data.js (export.py comes along, harmless).
      - uses: actions/upload-pages-artifact@v3
        with:
          path: map
      - id: deploy
        uses: actions/deploy-pages@v4
